name: Build nature sounds
# Run by hand: downloads the chosen real nature recordings (engine/nature_sources.json) and saves cleaned sound beds in engine/sounds/.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the sound beds
        run: sudo apt-get install -y -qq ffmpeg >/dev/null && python3 engine/build_nature_beds.py
      - name: Save them in the project
        run: |
          git config user.name "story-studio-bot"; git config user.email "story-studio-bot@users.noreply.github.com"
          git add engine/sounds; git diff --cached --quiet || (git commit -m "Real nature recordings for the sound beds" && git push)
