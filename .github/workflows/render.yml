name: Make videos
# Every 5 minutes: keep story planning going and make any videos that are ready.
# Quiet runs finish in seconds. Public repositories get unlimited free Actions minutes.
on:
  schedule: [{ cron: "*/5 * * * *" }, { cron: "17 3 * * 1" }]
  workflow_dispatch:
permissions:
  contents: write   # to publish the finished video as a release
  id-token: write   # GitHub-signed identity for the website (no passwords stored)
concurrency: { group: render, cancel-in-progress: false }
jobs:
  make:
    if: github.event.schedule != '17 3 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      API_URL: ${{ vars.API_URL || 'https://story-studio-kappa-one.vercel.app' }}
      GH_TOKEN: ${{ github.token }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}   # narration voice; falls back to the free voice if not set
    steps:
      - name: Anything to do?
        id: check
        run: |
          r=$(curl -sS --max-time 60 "$API_URL/api/jobs/pending" || echo '{}'); echo "$r"
          if echo "$r" | grep -Eq '"(planning|queued|calm)":[1-9]'; then echo "work=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.work == 'yes'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.work == 'yes'
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engine/requirements.txt }
      - name: Voice model (cached)
        if: steps.check.outputs.work == 'yes'
        uses: actions/cache@v4
        with: { path: /tmp/tts, key: kokoro-v1.0-int8 }
      - name: Install tools
        if: steps.check.outputs.work == 'yes'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter
          pip install -q -r engine/requirements.txt
          python -m playwright install --with-deps chromium
          mkdir -p /tmp/tts && cd /tmp/tts
          [ -f kokoro-v1.0.int8.onnx ] || curl -sSL -o kokoro-v1.0.int8.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          [ -f voices-v1.0.bin ] || curl -sSL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Make videos
        if: steps.check.outputs.work == 'yes'
        run: python engine/worker.py
  keepalive:
    # GitHub pauses schedules in public repos after 60 days without commits; this keeps it running.
    runs-on: ubuntu-latest
    if: github.event.schedule == '17 3 * * 1'
    steps:
      - uses: actions/checkout@v4
      - run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 50 ]; then
            git config user.name "story-studio-bot"; git config user.email "story-studio-bot@users.noreply.github.com"
            git commit --allow-empty -m "Keep the video maker schedule active" && git push
          fi
